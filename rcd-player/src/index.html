<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── SIDEBAR ──────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-header">
    <div id="logo">
      <span class="logo-icon">♘</span>
      <span class="logo-text">
        <strong>RCD</strong><span class="light">-PLAYER</span>
      </span>
    </div>
      <div id="header-actions">
        <button id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
          <svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7zm0-5a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0v-1a1 1 0 0 1 1-1zm9-9a1 1 0 0 1 0 2h-1a1 1 0 0 1 0-2h1zM4 12a1 1 0 0 1-1 1H2a1 1 0 0 1 0-2h1a1 1 0 0 1 1 1zm14.95 5.54a1 1 0 0 1 0 1.41 1 1 0 0 1-1.41 0l-.71-.7a1 1 0 0 1 1.41-1.42l.71.71zm-12.9-1.41a1 1 0 0 1 1.41 1.41l-.7.71a1 1 0 0 1-1.42-1.41l.71-.71zm12.9-12.08a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-1.41-1.42l.71-.7zM6.05 6.05a1 1 0 0 1-1.41 0l-.71-.7A1 1 0 0 1 5.34 3.93l.71.71a1 1 0 0 1 0 1.41z"/>
          </svg>
          <svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="hidden">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
          </svg>
        </button>
        <button id="btn-open-folder" title="Open Course Folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          Open
        </button>
      </div>
    </div>

    <!-- Course stats with circular ring -->
    <div id="stats-bar" class="hidden">
      <div id="stats-course-name"></div>
      <div id="stats-body">
        <div id="course-ring-wrap">
          <svg id="course-ring" viewBox="0 0 64 64" width="64" height="64">
            <circle class="ring-track" cx="32" cy="32" r="26"/>
            <circle class="ring-fill" id="course-ring-fill" cx="32" cy="32" r="26"/>
          </svg>
          <div id="course-ring-label">
            <span id="stat-percent">0%</span>
          </div>
        </div>
        <div id="stats-detail">
          <div class="stat-row">
            <span class="stat-dot completed"></span>
            <span class="stat-label">Done</span>
            <span class="stat-val" id="stat-completed">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-dot in-progress"></span>
            <span class="stat-label">Active</span>
            <span class="stat-val" id="stat-in-progress">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-dot"></span>
            <span class="stat-label">Total</span>
            <span class="stat-val" id="stat-total">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- File tree -->
    <div id="file-tree-wrapper">
      <div id="file-tree-empty">
        <div class="empty-icon">◈</div>
        <p>Open a course folder<br>to get started</p>
        <div id="recent-folders-section" class="hidden">
          <p class="recent-label">RECENT</p>
          <div id="recent-list"></div>
        </div>
      </div>
      <div id="file-tree"></div>
    </div>
  </aside>

  <!-- ── MAIN ──────────────────────────────────────────────────── -->
  <main id="main">
    <div id="video-container">
      <div id="video-placeholder">
        <div class="placeholder-icon">◈</div>
        <p>Select a video to begin</p>
      </div>
      <video id="video-player" preload="metadata"></video>

      <div id="video-overlay">
        <div id="overlay-top">
          <span id="now-playing-title"></span>
          <button id="btn-mark-complete" title="Mark as complete">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Mark Complete
          </button>
        </div>

        <div id="overlay-center">
          <button class="ctrl-btn" id="btn-prev" title="Previous">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn big" id="btn-playpause" title="Play/Pause">
            <svg id="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="btn-next" title="Next">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.14 3.64L8 15.14V9.86zM16 6h2v12h-2z"/></svg>
          </button>
        </div>

        <div id="overlay-bottom">
          <div id="seek-container">
            <div id="seek-track">
              <div id="seek-buffered"></div>
              <div id="seek-fill"></div>
              <div id="seek-thumb"></div>
            </div>
          </div>
          <div id="controls-row">
            <span id="time-display">
              <span id="time-current">0:00</span> / <span id="time-total">0:00</span>
            </span>
            <div id="speed-control">
              <label>SPEED</label>
              <select id="speed-select">
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2×</option>
              </select>
            </div>
            <div id="volume-control">
              <button id="btn-mute" title="Mute">
                <svg id="icon-vol" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <svg id="icon-mute" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.02" value="1" />
            </div>
            <button id="btn-fullscreen" title="Fullscreen">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
